<!DOCTYPE html>
<html>

<head>

    <title>Image Gallery</title>

    <style>

        /* Main page */
        body {
            margin: 0;
            background-color: black;
            font-family: Arial;
        }

        /* Website */
        .page {
            width: 410px;
            margin: auto;
            background-color: black;
        }

        /* Gallery header */
        .header {
            height: 89px;
            border-bottom: 3px solid #00a6a6;
            position: relative;
        }

        /* Small Union Jack */
        .flag {
            width: 107px;
            height: 76px;
            position: absolute;
            left: 5px;
            top: 11px;
        }

        /* Gallery title */
        .title {
            width: 162px;
            height: 53px;
            background-color: #aaaaaa;
            position: absolute;
            right: 8px;
            top: 17px;
            text-align: center;
        }

        .title h2 {
            font-size: 18px;
            margin-top: 17px;
            color: black;
        }

        /* Navigation */
        .navigation {
            height: 43px;
            background-color: #aaaaaa;
            border-bottom: 2px solid black;
            display: flex;
        }

        /* Navigation links */
        .navigation a {
            color: black;
            text-decoration: none;
            font-size: 17px;
            padding: 12px 15px;
        }

        /* Hover effect */
        .navigation a:hover {
            background-color: #777777;
            color: white;
        }

        /* Gallery */
        .gallery {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 14px 8px;
            padding: 18px 10px;
        }

        /* Gallery pictures */
        .gallery img {
            width: 100%;
            height: 114px;
            object-fit: cover;
        }

        /* Picture hover effect */
        .gallery img:hover {
            transform: scale(1.06);
            opacity: 0.8;
            box-shadow: 0px 0px 8px #00cccc;
        }

        /* Footer */
        .footer {
            color: white;
            text-align: center;
            font-size: 12px;
            padding: 20px;
        }

    </style>

</head>


<body>

    <div class="page">

        <!-- Header -->
        <div class="header">

            <img class="flag" src="images/gallery-flag.png">

            <div class="title">

                <h2>Image gallery</h2>

            </div>

        </div>


        <!-- Navigation -->
        <div class="navigation">

            <a href="index.html">Home</a>

            <a href="about.html">About us</a>

            <a href="gallery.html">Gallery</a>

        </div>


        <!-- Gallery -->
        <div class="gallery">

            <img src="images/gallery-1.png">

            <img src="images/gallery-2.png">

            <img src="images/gallery-3.png">

            <img src="images/gallery-4.png">

            <img src="images/gallery-5.png">

            <img src="images/gallery-6.png">

            <img src="images/gallery-7.png">

            <img src="images/gallery-8.png">

            <img src="images/gallery-9.png">

        </div>


        <!-- Footer -->
        <div class="footer">

            <p>British Values Website</p>

        </div>

    </div>

</body>

</html>
