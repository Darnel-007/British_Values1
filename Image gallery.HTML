<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* Main page */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: black;
            font-family: Arial;
        }

        /* Website */
        .page {
            width: 100%;
            max-width: 1200px;
            min-height: 100vh;
            margin: auto;
            background-color: black;
        }

        /* Gallery header */
        .header {
            height: 89px;
            border-bottom: 3px solid #00a6a6;
            position: relative;
        }

        /* Small Union Jack */
        .flag {
            width: 107px;
            height: 76px;
            position: absolute;
            left: 5px;
            top: 5px;
            object-fit: contain;
        }

        /* Gallery title */
        .title {
            width: 220px;
            min-height: 53px;
            background-color: #aaaaaa;
            position: absolute;
            right: 8px;
            top: 17px;
            text-align: center;
            padding: 10px;
        }

        .title h2 {
            font-size: 18px;
            margin: 5px 0;
            color: black;
        }

        /* Navigation */
        .navigation {
            min-height: 43px;
            background-color: #aaaaaa;
            border-bottom: 2px solid black;
            display: flex;
            flex-wrap: wrap;
        }

        /* Navigation links */
        .navigation a {
            color: black;
            text-decoration: none;
            font-size: 17px;
            padding: 12px 15px;
        }

        /* Hover effect */
        .navigation a:hover {
            background-color: #777777;
            color: white;
        }

        /* Gallery */
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
            padding: 25px;
        }

        /* Gallery pictures */
        .gallery img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            transition: transform 0.3s, opacity 0.3s, box-shadow 0.3s;
        }

        /* Picture hover effect */
        .gallery img:hover {
            transform: scale(1.03);
            opacity: 0.8;
            box-shadow: 0 0 8px #00cccc;
        }

        /* Footer */
        .footer {
            color: white;
            text-align: center;
            font-size: 14px;
            padding: 20px;
        }

        /* Medium screens */
        @media (max-width: 800px) {
            .gallery {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 15px;
                padding: 15px;
            }

            .gallery img {
                height: 220px;
            }
        }

        /* Mobile screens */
        @media (max-width: 500px) {
            .flag {
                width: 90px;
                height: 70px;
            }

            .title {
                width: 170px;
                right: 5px;
            }

            .navigation a {
                font-size: 15px;
                padding: 12px 10px;
            }

            .gallery {
                grid-template-columns: 1fr;
            }

            .gallery img {
                height: auto;
                aspect-ratio: 4 / 3;
            }
        }
    </style>
</head>

<body>
    <div class="page">

        <!-- Header -->
        <div class="header">
            <img class="flag"
                 src="images/gallery-flag.png"
                 alt="Union Jack">

            <div class="title">
                <h2>Image gallery</h2>
            </div>
        </div>

        <!-- Navigation -->
        <div class="navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About us</a>
            <a href="gallery.html">Gallery</a>
        </div>

        <!-- Gallery -->
        <div class="gallery">
            <img src="images/gallery-1.png" alt="Gallery image 1">
            <img src="images/gallery-2.png" alt="Gallery image 2">
            <img src="images/gallery-3.png" alt="Gallery image 3">
            <img src="images/gallery-4.png" alt="Gallery image 4">
            <img src="images/gallery-5.png" alt="Gallery image 5">
            <img src="images/gallery-6.png" alt="Gallery image 6">
            <img src="images/gallery-7.png" alt="Gallery image 7">
            <img src="images/gallery-8.png" alt="Gallery image 8">
            <img src="images/gallery-9.png" alt="Gallery image 9">
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>British Values Website</p>
        </div>

    </div>
</body>
</html>
