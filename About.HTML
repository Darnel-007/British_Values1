<!DOCTYPE html>
<html>
<head>
    <title>About Us</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* Main page */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: black;
            font-family: Arial;
        }

        /* Website width */
        .page {
            width: 100%;
            max-width: 1200px;
            min-height: 100vh;
            margin: auto;
            background-color: black;
        }

        /* Header */
        .header {
            height: 105px;
            border-bottom: 3px solid #00a6a6;
            position: relative;
        }

        /* Logo */
        .logo {
            width: 105px;
            height: 98px;
            margin-left: 8px;
            margin-top: 3px;
            object-fit: contain;
        }

        /* Flag */
        .flag {
            width: 123px;
            height: 100px;
            position: absolute;
            right: 5px;
            top: 2px;
            object-fit: contain;
        }

        /* Navigation */
        .navigation {
            min-height: 43px;
            background-color: #aaaaaa;
            border-bottom: 2px solid black;
            display: flex;
            flex-wrap: wrap;
        }

        /* Navigation links */
        .navigation a {
            color: black;
            text-decoration: none;
            font-size: 17px;
            padding: 12px 15px;
        }

        /* Hover effect */
        .navigation a:hover {
            background-color: #777777;
            color: white;
        }

        /* About Us title */
        .title {
            width: 90%;
            margin: 20px auto;
            border: 2px solid #777777;
            color: white;
            text-align: center;
            padding: 10px;
        }

        /* Main information */
        .about-section {
            display: flex;
            align-items: stretch;
            margin: 20px;
        }

        /* Text */
        .about-text {
            width: 53%;
            color: white;
            border: 2px solid #777777;
            padding: 20px;
            text-align: center;
            font-size: 16px;
            line-height: 1.6;
        }

        /* Big Ben picture */
        .about-image {
            width: 47%;
            min-height: 350px;
            object-fit: cover;
        }

        /* Footer */
        .footer {
            color: white;
            text-align: center;
            font-size: 14px;
            padding: 20px;
            margin-top: 40px;
        }

        /* Smaller screens */
        @media (max-width: 600px) {
            .header {
                height: 90px;
            }

            .logo {
                width: 80px;
                height: 85px;
            }

            .flag {
                width: 95px;
                height: 85px;
            }

            .navigation a {
                font-size: 15px;
                padding: 12px 10px;
            }

            .about-section {
                flex-direction: column;
                margin: 15px;
            }

            .about-text,
            .about-image {
                width: 100%;
            }

            .about-image {
                min-height: 250px;
                max-height: 350px;
            }
        }
    </style>
</head>

<body>
    <div class="page">

        <!-- Header -->
        <div class="header">
            <img class="logo" src="images/logo.png" alt="Website logo">
            <img class="flag" src="images/uk-flag.png" alt="Union Jack">
        </div>

        <!-- Navigation -->
        <div class="navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About us</a>
            <a href="gallery.html">Gallery</a>
        </div>

        <!-- Page title -->
        <div class="title">
            <h2>About us</h2>
        </div>

        <!-- About information -->
        <div class="about-section">

            <div class="about-text">
                <h3>About Us</h3>

                <p>
                    Our website is about British values
                    and the importance of understanding
                    the values that are part of British
                    society.
                </p>

                <p>
                    We have created this website to
                    provide information about Britain,
                    its culture and important places.
                </p>
            </div>

            <img class="about-image"
                 src="images/big-ben.png"
                 alt="Big Ben in London">

        </div>

        <!-- Footer -->
        <div class="footer">
            <p>British Values Website</p>
        </div>

    </div>
</body>
</html>
