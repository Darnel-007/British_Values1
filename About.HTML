<!DOCTYPE html>
<html>

<head>

    <title>About Us</title>

    <style>

        /* Main page */
        body {
            margin: 0;
            background-color: black;
            font-family: Arial;
        }

        /* Website width */
        .page {
            width: 410px;
            margin: auto;
            background-color: black;
        }

        /* Header */
        .header {
            height: 105px;
            border-bottom: 3px solid #00a6a6;
            position: relative;
        }

        /* Logo */
        .logo {
            width: 105px;
            height: 98px;
            margin-left: 8px;
            margin-top: 3px;
        }

        /* Flag */
        .flag {
            width: 123px;
            height: 100px;
            position: absolute;
            right: 5px;
            top: 2px;
        }

        /* Navigation */
        .navigation {
            height: 43px;
            background-color: #aaaaaa;
            border-bottom: 2px solid black;
            display: flex;
        }

        /* Navigation links */
        .navigation a {
            color: black;
            text-decoration: none;
            font-size: 17px;
            padding: 12px 15px;
        }

        /* Hover effect */
        .navigation a:hover {
            background-color: #777777;
            color: white;
        }

        /* About Us title */
        .title {
            width: 90%;
            margin: 15px auto;
            border: 2px solid #777777;
            color: white;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
        }

        /* Main information */
        .about-section {
            display: flex;
            margin-top: 15px;
        }

        /* Text */
        .about-text {
            width: 53%;
            color: white;
            border: 2px solid #777777;
            padding: 10px;
            box-sizing: border-box;
            text-align: center;
            font-size: 12px;
        }

        /* Big Ben picture */
        .about-image {
            width: 47%;
            height: 191px;
            object-fit: cover;
        }

        /* Footer */
        .footer {
            color: white;
            text-align: center;
            font-size: 12px;
            padding: 20px;
            margin-top: 120px;
        }

    </style>

</head>


<body>

    <div class="page">

        <!-- Header -->
        <div class="header">

            <img class="logo" src="images/logo.png">

            <img class="flag" src="images/uk-flag.png">

        </div>


        <!-- Navigation -->
        <div class="navigation">

            <a href="index.html">Home</a>

            <a href="about.html">About us</a>

            <a href="gallery.html">Gallery</a>

        </div>


        <!-- Page title -->
        <div class="title">

            <h2>About us</h2>

        </div>


        <!-- About information -->
        <div class="about-section">

            <div class="about-text">

                <h3>About Us</h3>

                <p>
                    Our website is about British values
                    and the importance of understanding
                    the values that are part of British
                    society.
                </p>

                <p>
                    We have created this website to
                    provide information about Britain,
                    its culture and important places.
                </p>

            </div>


            <img class="about-image" src="images/big-ben.png">

        </div>


        <!-- Footer -->
        <div class="footer">

            <p>British Values Website</p>

        </div>

    </div>

</body>

</html>
