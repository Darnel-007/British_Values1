<!DOCTYPE html>
<html>
<head>
    <title>British Values</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* This changes the whole page */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: black;
            font-family: Arial;
        }

        /* This is the main website */
        .page {
            width: 100%;
            max-width: 1200px;
            min-height: 100vh;
            margin: auto;
            background-color: black;
        }

        /* Top part of the website */
        .header {
            height: 105px;
            border-bottom: 3px solid #00a6a6;
            position: relative;
        }

        /* Logo on the left */
        .logo {
            width: 105px;
            height: 98px;
            margin-left: 8px;
            margin-top: 3px;
            object-fit: contain;
        }

        /* Union Jack on the right */
        .flag {
            width: 123px;
            height: 100px;
            position: absolute;
            right: 5px;
            top: 2px;
            object-fit: contain;
        }

        /* Navigation bar */
        .navigation {
            min-height: 43px;
            background-color: #aaaaaa;
            border-bottom: 2px solid black;
            display: flex;
            flex-wrap: wrap;
        }

        /* Navigation buttons */
        .navigation a {
            color: black;
            text-decoration: none;
            font-size: 17px;
            padding: 12px 15px;
        }

        /* Hover effect */
        .navigation a:hover {
            background-color: #777777;
            color: white;
        }

        /* Line underneath navigation */
        .line {
            width: 90%;
            height: 2px;
            background-color: #00a6a6;
            margin: 10px auto;
        }

        /* First section */
        .top-section {
            display: flex;
            margin-top: 10px;
            align-items: stretch;
        }

        .top-section img {
            width: 52%;
            height: 300px;
            object-fit: cover;
        }

        .top-text {
            width: 48%;
            color: #00cccc;
            font-size: 16px;
            text-align: center;
            padding: 20px;
        }

        /* Second section */
        .bottom-section {
            display: flex;
            margin-top: 35px;
            align-items: stretch;
        }

        .bottom-section img {
            width: 51%;
            height: 350px;
            object-fit: cover;
        }

        .bottom-text {
            width: 49%;
            color: white;
            border: 2px solid #777777;
            font-size: 16px;
            text-align: center;
            padding: 20px;
        }

        /* Footer */
        .footer {
            color: white;
            text-align: center;
            font-size: 14px;
            padding: 20px;
        }

        /* Laptop and smaller screen sizing */
        @media (max-width: 600px) {
            .header {
                height: 90px;
            }

            .logo {
                width: 80px;
                height: 85px;
            }

            .flag {
                width: 95px;
                height: 85px;
            }

            .navigation a {
                font-size: 15px;
                padding: 12px 10px;
            }

            .top-section,
            .bottom-section {
                flex-direction: column;
                margin: 15px;
            }

            .top-section img,
            .bottom-section img,
            .top-text,
            .bottom-text {
                width: 100%;
                height: auto;
            }

            .top-section img,
            .bottom-section img {
                max-height: 300px;
            }
        }
    </style>
</head>

<body>
    <div class="page">

        <!-- Header -->
        <div class="header">
            <img class="logo" src="images/logo.png" alt="Website logo">
            <img class="flag" src="images/uk-flag.png" alt="Union Jack">
        </div>

        <!-- Navigation -->
        <div class="navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About us</a>
            <a href="gallery.html">Gallery</a>
        </div>

        <!-- Teal line -->
        <div class="line"></div>

        <!-- First section -->
        <div class="top-section">
            <img src="images/values-flag.png" alt="British values flag">

            <div class="top-text">
                <h3>British Values</h3>
                <p>
                    British values are important values
                    that help people live together fairly
                    and respectfully.
                </p>
            </div>
        </div>

        <!-- Second section -->
        <div class="bottom-section">
            <img src="images/icons-england.png" alt="British values icons">

            <div class="bottom-text">
                <h3>Our Values</h3>
                <p>
                    The main British values include
                    democracy, the rule of law,
                    individual liberty, and mutual
                    respect and tolerance.
                </p>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>British Values Website</p>
        </div>

    </div>
</body>
</html>
